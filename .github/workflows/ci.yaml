# Vet, test and build the image (no push) on every push and PR, so a broken
# Dockerfile is caught before a release tag triggers image.yaml.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Generated code is up to date
        run: go generate ./api/... && git diff --exit-code -- api config
      - name: Build image
        run: docker build -t platform-promoter:ci .
